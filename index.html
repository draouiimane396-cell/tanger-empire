<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدينة طنجة - لعبة حرب</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;margin:0;padding:10px}
.top{background:#1e293b;border-radius:15px;padding:10px}
button{border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:bold;width:100%;margin:5px 0}
.tab{background:#334155;color:white;width:48%}
.active{background:#facc15;color:black}
.build{font-size:45px;background:#1e293b;border-radius:18px;padding:12px;margin:6px 0;border:2px solid #334155}
.city{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#1e293b;border-radius:15px;padding:12px;margin:8px 0}
.enemy{background:#374151;border-radius:12px;padding:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<h2>⚔️ مدينة طنجة ⚔️</h2>
<div class="top">💰 <b id="gold">800</b> | 🪵 <b id="wood">500</b> | ⚔️ <b id="army">15</b> | ❤️ جرحى: <b id="wounded">0</b></div>
<p id="msg" style="color:#facc15">مرحبا بيك فمدينتك يا قائد!</p>
<button class="tab active" id="btnCity" onclick="show('city')">🏠 المدينة</button>
<button class="tab" id="btnMap" onclick="show('map')">🗺️ الخريطة</button>
<div id="cityView">
<div class="city">
<div class="build" onclick="openBarracks()">🪖<br>الثكنة<br><small>مستوى <span id="lvBar">1</span></small></div>
<div class="build" onclick="openHospital()">🏥<br>المستشفى<br><small>مستوى <span id="lvHos">1</span></small></div>
<div class="build" onclick="openAcademy()">🎓<br>الأكاديمية<br><small>مستوى <span id="lvAcad">1</span></small></div>
<div class="build" onclick="openMine()">⛏️<br>المنجم<br><small>مستوى <span id="lvMine">1</span></small></div>
</div>
<div class="card" id="actionBox">كليكي على أي بناية باش تخدم فيها</div>
</div>
<div id="mapView" style="display:none">
<div class="card">🗺️ خريطة المغرب - القوة ديالك: <b id="power">150</b></div>
<div id="enemies"></div>
</div>
<script>
let gold=800, wood=500, army=15, wounded=0, research=0, lvBar=1, lvHos=1, lvAcad=1, lvMine=1, power=150;
let enemies=[{name:"تطوان 🏰",p:120,r:300},{name:"فاس 🏰",p:250,r:600},{name:"كازا 🏰",p:450,r:1200},{name:"مراكش 🏰",p:700,r:2000}];
function update(){
 document.getElementById('gold').innerText=gold; document.getElementById('wood').innerText=wood;
 document.getElementById('army').innerText=army; document.getElementById('wounded').innerText=wounded;
 document.getElementById('power').innerText=power; document.getElementById('lvBar').innerText=lvBar;
 document.getElementById('lvHos').innerText=lvHos; document.getElementById('lvAcad').innerText=lvAcad; document.getElementById('lvMine').innerText=lvMine;
 let h=""; enemies.forEach((e,i)=>{ h+=`<div class="enemy"><span>${e.name}<br>قوة: ${e.p} | غنيمة: ${e.r}</span><button style="width:90px;background:#dc2626;color:white" onclick="attack(${i})">هجم ⚔️</button></div>`; });
 document.getElementById('enemies').innerHTML=h;
}
function show(v){ document.getElementById('cityView').style.display=v=='city'?'block':'none'; document.getElementById('mapView').style.display=v=='map'?'block':'none'; document.getElementById('btnCity').className='tab '+(v=='city'?'active':''); document.getElementById('btnMap').className='tab '+(v=='map'?'active':''); }
function openBarracks(){ document.getElementById('actionBox').innerHTML=`<b>🪖 الثكنة</b><br><button style="background:#dc2626;color:white" onclick="train()">جند 5 جنود - 100 ذهب</button><button style="background:#2563eb;color:white" onclick="upgrade('bar')">طور الثكنة - 200 ذهب</button>`; }
function openHospital(){ document.getElementById('actionBox').innerHTML=`<b>🏥 المستشفى - عندك ${wounded} جريح</b><br><button style="background:#16a34a;color:white" onclick="heal()">داوي الكل</button><button style="background:#2563eb;color:white" onclick="upgrade('hos')">طور المستشفى - 200 ذهب</button>`; }
function openAcademy(){ document.getElementById('actionBox').innerHTML=`<b>🎓 الأكاديمية - بحث: ${research}</b><br><button style="background:#7c3aed;color:white" onclick="researchUp()">بحث جديد - 300 ذهب (+20 قوة)</button>`; }
function openMine(){ document.getElementById('actionBox').innerHTML=`<b>⛏️ المنجم</b><br><button style="background:#facc15" onclick="collect()">جمع الذهب +${lvMine*100}</button><button style="background:#2563eb;color:white" onclick="upgrade('mine')">طور المنجم - 200 ذهب</button>`; }
function train(){ if(gold<100) return alert('ما عندكش ذهب'); gold-=100; army+=5; power+=30; document.getElementById('msg').innerText='زدتي 5 جنود! 🪖'; update(); }
function heal(){ if(wounded==0) return; gold-=wounded*50; army+=wounded; wounded=0; document.getElementById('msg').innerText='داويتي الكل! 🏥'; update(); }
function researchUp(){ if(gold<300) return alert('ما عندكش ذهب'); gold-=300; research++; power+=20; document.getElementById('msg').innerText='بحث جديد! 🎓'; update(); }
function collect(){ gold+=lvMine*100; update(); }
function upgrade(t){ if(gold<200) return alert('ما عندكش ذهب'); gold-=200; if(t=='bar')lvBar++; if(t=='hos')lvHos++; if(t=='mine')lvMine++; update(); }
function attack(i){ let e=enemies[i]; if(power>e.p){ gold+=e.r; document.getElementById('msg').innerText=`ربحتي ضد ${e.name}! +${e.r} ذهب 🏆`; e.p+=80; e.r+=150; wounded+=2; } else { gold-=100; wounded+=5; document.getElementById('msg').innerText=`خسرتي! سير للمستشفى داوي الجنود 😤`; } update(); }
update();
</script>
</body>
</html>
